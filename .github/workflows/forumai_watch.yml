# Weekly FORUM-AI publication watch.
# Sweeps arXiv + OpenAlex for the FORUM-AI PIs, reads the acknowledgements of the few new records, and
# appends review items to candidates.json. The tracker Google Sheet pulls that file with Code.gs.
# seen.json is committed too, so the same paper is never processed twice.

name: forumai-watch
on:
  schedule:
    - cron: "17 14 * * 1"        # Mondays 14:17 UTC = 07:17 Pacific; the sheet pulls Tuesday 8am
  workflow_dispatch:
    inputs:
      days:
        description: "arXiv look-back window in days"
        default: "14"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: sudo apt-get install -y -qq poppler-utils      # pdftotext
      - name: watch
        run: |
          uv run forumai_watch.py --days "${{ github.event.inputs.days || '14' }}" \
            --publish candidates.json --no-fulltext-tool | tee report.md
      - name: commit ledger + feed
        run: |
          git config user.name "forumai-watch"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json candidates.json
          git diff --cached --quiet || (git commit -m "forumai-watch $(date -u +%F)" && git push)
      - name: summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
